name: Build SoundDock installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $installed = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ }
          if (-not $installed) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Failed to install Inno Setup.' }
          }

      - name: Publish app and compile installer
        shell: pwsh
        run: |
          if (-not (Test-Path ".\SoundDock\SoundDock.csproj")) {
            throw "SoundDock project missing. Upload the app source alongside the installer files."
          }
          .\build-installer.ps1

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem 'dist\SoundDock-Setup-*-win-x64.exe')
          if ($setup.Count -ne 1) { throw "Expected one installer, found $($setup.Count)." }
          if ($setup[0].Length -lt 1000000) { throw 'Unexpectedly small installer.' }
          Get-FileHash -Algorithm SHA256 $setup[0].FullName | Format-List

      - name: Upload downloadable installer
        uses: actions/upload-artifact@v4
        with:
          name: SoundDock-Windows-Installer
          path: dist/SoundDock-Setup-*-win-x64.exe
          if-no-files-found: error

      - name: Attach installer to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          [xml]$project = Get-Content 'SoundDock\SoundDock.csproj' -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($tag -ne "v$version") {
            throw "Release tag $tag does not match project version v$version."
          }
          $installer = (Get-ChildItem 'dist\SoundDock-Setup-*-win-x64.exe' | Select-Object -First 1).FullName
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --clobber
          } else {
            gh release create $tag $installer --title "SoundDock $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the installer release.' }
