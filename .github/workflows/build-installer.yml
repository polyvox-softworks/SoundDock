name: Build SoundDock installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check project layout
        shell: pwsh
        run: |
          Write-Host 'SoundDock installer workflow: direct-publish revision'
          foreach ($file in @('SoundDock/SoundDock.csproj', 'SoundDock.iss')) {
            if (-not (Test-Path -LiteralPath $file)) {
              Get-ChildItem -Name
              throw "Missing $file in the repository root. Verify the files are committed to the branch selected for this workflow."
            }
          }

      - name: Publish SoundDock (Windows x64)
        shell: pwsh
        run: |
          dotnet publish ./SoundDock/SoundDock.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output ./publish/win-x64 `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          if (-not (Test-Path './publish/win-x64/SoundDock.exe')) {
            throw 'Publish completed without creating SoundDock.exe.'
          }

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $installed = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $installed -and -not ($paths | Where-Object { Test-Path $_ })) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup.' }
          }

      - name: Compile Windows installer
        shell: pwsh
        run: |
          [xml]$project = Get-Content './SoundDock/SoundDock.csproj' -Raw
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          if (-not $versionNode) { throw 'Missing <Version> in SoundDock.csproj.' }
          $version = $versionNode.InnerText.Trim()

          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $compiler = if ($command) { $command.Source } else {
            $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $compiler) { throw 'Inno Setup compiler (ISCC.exe) was not found.' }

          & $compiler "/DAppVersion=$version" './SoundDock.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
          $setup = "./dist/SoundDock-Setup-$version-win-x64.exe"
          if (-not (Test-Path $setup)) { throw "Missing installer: $setup" }
          Write-Host "Installer built: $setup"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundDock-Windows-Installer
          path: dist/SoundDock-Setup-*-win-x64.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content './SoundDock/SoundDock.csproj' -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$version") {
            throw "Tag $tag must match version v$version in SoundDock.csproj."
          }
          $setup = (Get-ChildItem './dist/SoundDock-Setup-*-win-x64.exe' | Select-Object -First 1).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup --clobber
          } else {
            gh release create $tag $setup --title "SoundDock $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release upload failed.' }
